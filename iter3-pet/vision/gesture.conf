# TARS gesture driving: shared tuning. Read by BOTH implementations:
#   iter3-pet/vision/common/gesture.py   (Mac desktop prototype + QNX Python app)
#   iter3-pet/vision/common/gesture.hpp  (QNX C++ app)
# Format: key = value, '#' comments. Unknown keys are an error (typo guard).
# Rules these numbers feed are described in iter3-pet/vision/GESTURES.md.

# ---- hand shape (ratios are scale-free: distances / palm size) ----
# finger "extended" when |wrist->tip| > ext_ratio * |wrist->pip|
ext_ratio = 1.20
# finger "folded" when |wrist->tip| < fold_ratio * |wrist->pip|
fold_ratio = 1.00
# thumb "out" when |thumb_tip - index_mcp| > thumb_out * palm
thumb_out = 0.55
# a point/thumb direction must be within this many degrees of up/down/left/right
dir_tolerance_deg = 40

# ---- debounce / timing (milliseconds unless noted) ----
# consecutive identical frames needed before a MOVE fires
stable_frames = 4
# frames of open palm needed before STOP (1 = react on the first frame)
stop_frames = 1
# hand missing this long -> STOP (and cancel any move)
lost_ms = 250
# no camera frame this long -> STOP (camera stalled / app hung)
frame_timeout_ms = 400
# pause after a move finishes before the next one may start
cooldown_ms = 400
# 1 = holding a gesture repeats the move (after cooldown); 0 = must release first
hold_repeat = 1
# resend D this often during a move (server watchdog is 500 ms)
resend_ms = 100

# ---- moves ----
# forward/back step: speed in [0,1] and duration
step_speed = 0.50
step_ms = 600
# turn: wheels at +-turn_speed for turn_ms -> should be 30 degrees. CALIBRATE:
# run "python iter3-pet/vision/desktop/calibrate_turn.py" (12 turns should = 360 deg)
turn_speed = 0.50
turn_ms = 450
# which way "point left" turns the rover: 1 = rover turns to ITS left (CCW seen
# from above). Set 0 if the rover faces you and you want it to turn toward
# where you point.
point_left_is_left = 1

# ---- mode switch: peace sign (index + middle up) toggles GESTURE <-> FOLLOW ----
# consecutive peace frames needed to toggle (also needs a release in between)
mode_frames = 6
# no second toggle within this long
mode_cooldown_ms = 1500

# ---- follow mode: steer toward the hand ----
# x error = hand centre - frame centre, in [-0.5, 0.5] of frame width (rover's view)
follow_deadband = 0.08
# turn = kp * (|err| - deadband), clamped to +-max_turn (wheel speed units)
follow_kp_turn = 1.2
follow_max_turn = 0.35
# hand size = wrist->middle-knuckle length / frame height. Bigger = closer.
follow_target_size = 0.22
follow_size_deadband = 0.03
# forward = kp * (target - size - deadband), clamped to [-max_back, max_fwd]
follow_kp_fwd = 3.0
follow_max_fwd = 0.45
# back up slowly when the hand is too close (0 = never reverse)
follow_max_back = 0.20
# max wheel speed change per second (smooths the 15 Hz stream)
follow_slew_per_s = 2.0
# send D this often while following (watchdog is 500 ms)
follow_send_ms = 66
# hand missing for this many consecutive frames -> STOP
follow_grace_frames = 4
# open palm held this many frames -> STOP (stop still wins in follow mode)
follow_palm_frames = 2
# 1 = flip the steering direction (if it turns AWAY from your hand)
follow_invert_turn = 0

# ---- camera / inference ----
# mirror the image before inference (selfie view: your left is image left)
flip = 1
# frames are downscaled to this width before MediaPipe (0 = no resize)
infer_width = 320
# MediaPipe hand landmarker thresholds
min_detection_confidence = 0.5
min_tracking_confidence = 0.5

# ---- actions a learned pose can trigger (iter3-pet/vision/GESTURES.md section 7) ----
# spin = turn_ms * spin_turns at turn_speed (12 x 30 deg = 360 deg, once calibrated)
spin_turns = 12
# wiggle = 5 short left/right swings; this is the shortest swing
wiggle_ms = 180
# arms = "G wave" to tars_motor, then wait this long (S at the end halts the arms)
arms_ms = 2500

# ---- teach a new pose on the spot (iter3-pet/vision/GESTURES.md section 7) ----
# TEACH = shaka (index/middle/ring folded, pinky out). Hold this long to start teaching
teach_hold_ms = 2000
# countdown after the trigger (one nudge per second), then recording starts.
# Still holding TEACH when the countdown ends (= teach_hold_ms + this) -> FORGET all learned poses
teach_countdown_ms = 3000
# tolerate this many consecutive frames of a different label inside a held TEACH
learn_gap_frames = 3
# open palm held this many frames cancels teaching (the S goes out on the first frame)
learn_cancel_frames = 3
# hand frames to record for a new pose
learn_frames = 40
# give up recording (no hand) after this long
learn_record_timeout_ms = 6000
# after recording: show an existing gesture to pick the action; nothing for this long = wiggle
learn_assign_ms = 5000
# frames the picking gesture must be held
learn_assign_frames = 6
# no new teach right after one ends
learn_cooldown_ms = 1500
# reject the pose if this fraction of its frames already reads as a built-in gesture
learn_builtin_frac = 0.30
# reject the pose if this fraction of its frames is accepted by an already-learned pose
learn_similar_frac = 0.30
# at most this many learned poses
learn_max_classes = 8
# k-NN: mean distance to the k nearest examples of a class
learn_k = 3
# jittered copies stored per recorded frame, and the jitter (palm-length units / radians)
learn_augment = 2
learn_jitter = 0.04
# weight of the 15 finger-bend angles vs the 42 normalised coordinates
learn_angle_weight = 0.5
# per-pose accept radius = clamp(mult * (mean + 2 sd of its own leave-one-out k-NN distance), min, max)
learn_thr_mult = 1.5
learn_thr_min = 0.45
learn_thr_max = 0.90

# ---- robot-body feedback while teaching (no screen) ----
# small wiggles/nudges: wheel speed and segment lengths
feedback_speed = 0.35
feedback_ms = 150
nudge_ms = 120
# 1 = also send "LED <pattern>" / "BEEP <n>" to tars_motor (ERR replies are fine)
feedback_led_beep = 1

# ---- pet mode (iter3-pet/vision/common/pet.py, iter3-pet/vision/GESTURES.md section 8) ----
# 1 = the held peace sign cycles GESTURE -> FOLLOW -> PET -> GESTURE; 0 = GESTURE <-> FOLLOW only
pet_in_cycle = 1
# 1 = start in PET mode (same as --pet on the apps)
pet_start = 0
# in PET mode: hold peace this long to leave (back to GESTURE); a shorter flash (>= pet_trick_frames) = trick
pet_exit_ms = 2000
pet_trick_frames = 3
# tolerate this many non-peace flicker frames inside a peace flash/hold
pet_gap_frames = 2
# fist held this many frames -> sleep ("play dead")
pet_sleep_frames = 20
# wave = palm swinging side to side: >= pet_wave_swings direction reversals of >= pet_wave_amp
# (fraction of frame width) within pet_wave_window_ms. Greets when the palm drops (palm = stop, always)
pet_wave_window_ms = 1500
pet_wave_amp = 0.04
pet_wave_swings = 2
# D stream while watching / coming (server watchdog is 500 ms); watch settles (one S) after this long at 0
pet_send_ms = 100
pet_settle_ms = 1500
# come here: approach until palm size >= pet_come_size (image heights), forward <= pet_come_max_fwd,
# and at most pet_come_max_ms per command (~4-8 cm/s x 5 s = at most ~20-40 cm)
pet_come_size = 0.30
pet_come_max_fwd = 0.40
pet_come_max_ms = 5000
# body language: wiggle swing, happy spin swing, sad back-up, look-around turn (ms)
pet_body_ms = 160
pet_happy_ms = 300
pet_sad_ms = 400
pet_look_ms = 250
# hard bounds on every pet body-language segment (the trick spin is turn_ms x spin_turns)
pet_max_seg_ms = 400
pet_max_speed = 0.60
# no hand this long -> occasional look-around turns every pet_look_every_ms; -> sleep after pet_sleep_after_ms
pet_bored_ms = 4000
pet_look_every_ms = 3000
pet_sleep_after_ms = 20000
# mood / energy in [0,1]: decays toward rest; thumbs up / wave / arrive raise it, thumbs down lowers it
pet_energy_start = 0.5
pet_energy_rest = 0.3
pet_energy_decay_per_s = 0.02
pet_happy_boost = 0.25
pet_greet_boost = 0.15
pet_come_boost = 0.10
pet_sad_drop = 0.25
# energy >= this: thumbs up does the full trick spin ("zoomies") instead of the little happy spin
pet_excited = 0.75
# body-language wheel speed = pet_speed_min + (pet_speed_max - pet_speed_min) x energy
pet_speed_min = 0.25
pet_speed_max = 0.50
# seed for the pet's deterministic RNG (look-around direction / chance)
pet_seed = 1
