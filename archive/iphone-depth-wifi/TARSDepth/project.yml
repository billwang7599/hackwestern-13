# xcodegen spec. The generated TARSDepth.xcodeproj is committed, so you only
# need xcodegen (brew install xcodegen) if you change this file:
#   cd iphone/TARSDepth && xcodegen
name: TARSDepth
options:
  bundleIdPrefix: dev.tars
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TARSDepth:
    type: application
    platform: iOS
    sources: [TARSDepth]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tars.TARSDepth   # change to something unique for free signing
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSCameraUsageDescription: "TARS uses the LiDAR depth camera as a virtual lidar for obstacle avoidance."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "TARS sends depth scans to the robot's Pi over the local Wi-Fi."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        CODE_SIGN_STYLE: Automatic
