# tars_voice config (key = value; '#' comments). Command-line flags override:
#   tars_voice -c voice.conf --any --dry ...
# All of this runs on the Pi under QNX; no laptop or internet needed.

# ---- input: qnx = preferred io-audio capture device; qnx:C,D = card C device D (see ./mic_test -l)
#      phone = the iPhone on the car streams its mic (AirPods) over USB: TCP 127.0.0.1:5577
#              (iproxy, like 5573; the phone app's "Robot mic" switch must be on). Same VAD,
#              wake word and stop-first path as qnx. phone:HOST:PORT for another address.
#              The robot itself has no mic, so on the car this is the one to use.
input = phone
model = models/ggml-tiny.en-q5_1.bin

# ---- CPU budget: whisper only runs on a speech segment (<= 3 s). 2 threads
# leaves 2 of the Pi 5's 4 cores for YOLO / vision. audio_ctx 0 = auto (512).
threads = 2
audio_ctx = 0

# ---- where commands go
host = 127.0.0.1          # tars_motor (MOVE/TURN/S/LED/BEEP/STATUS)
port = 5555
goto_host = 127.0.0.1     # go-to controller (GOTO <object> / CANCEL), iter2-autonomy/goto/
goto_port = 5570
goto_reply_ms = 300       # wait this long for its reply line (no reply is fine)
say_host = 127.0.0.1      # QNXplorer speech -> phone (iPhone app via iproxy): "SAY <text>" lines
say_port = 5573           # 0 = off. Best effort: no phone = nothing happens, never delays a stop
say_ms = 150              # connect timeout for it
net_host = 127.0.0.1      # network input: HEAR <text> / AUDIO <bytes> / WATCH (laptop mission control
net_port = 5574           # via iter2-autonomy/mission/ relay). 0 = off. Loopback: the relay is the only way in

# ---- wake word "TARS" (0 = any speech is a command: only for a quiet room)
require_wake = 1
wake_carry_ms = 4000      # "TARS" ... pause ... "turn left" still counts
button_talk = 1           # Uno button press = listen for wake_carry_ms, no wake word needed

# ---- feedback
led_ms = 1500             # "LED no" shown this long after a not-understood command

# ---- voice activity detection (20 ms frames)
vad_ratio = 6             # speech = this x louder (power) than the background (6 = ~8 dB)
vad_min_dbfs = -45        # and louder than this absolute level
vad_start_frames = 3      # 60 ms of loud to start
vad_hang_ms = 400         # 400 ms of quiet ends a segment
vad_pre_ms = 300          # keep 300 ms before the start ("T" of TARS)
vad_min_ms = 150          # ignore clicks shorter than this
vad_max_ms = 3000         # cut segments at 3 s (keeps whisper fast)

# save every segment as WAV for debugging (empty = off), e.g. save_dir = logs
save_dir =
