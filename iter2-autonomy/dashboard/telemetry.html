<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QNXplorer Telemetry</title>
<style>
:root{--bg:#0d1417;--panel:#141e22;--line:#24323a;--text:#dde8ea;--mut:#8ea2a8;--ok:#6fe0b2;--warn:#f0c070;--bad:#ff7468;--acc:#78b4ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:12.5px/1.3 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
header b{font-size:14px;margin-right:4px}
.pill{padding:1px 7px;border-radius:9px;font-weight:700;font-size:11.5px;background:#ffffff10}
#banner{color:var(--warn);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;margin-left:4px}
header a{color:var(--acc);text-decoration:none}
main{display:grid;gap:6px;padding:6px;min-height:0;grid-template-columns:minmax(0,1.25fr) minmax(0,1.1fr) minmax(0,.95fr)}
.view{position:relative;background:#080d0f;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0}
.view canvas{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;left:6px;top:5px;font-size:11px;color:var(--mut);background:#080d0fcc;padding:1px 5px;border-radius:4px;pointer-events:none}
.tools{position:absolute;right:5px;top:4px;display:flex;gap:4px}
button{font:inherit;font-size:11px;color:var(--text);background:#ffffff14;border:1px solid var(--line);border-radius:4px;padding:1px 6px;cursor:pointer}
#maps{display:grid;grid-template-rows:minmax(0,1.35fr) minmax(0,1fr);gap:6px;min-height:0}
#data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;overflow:auto;min-height:0;align-content:start}
.view canvas{touch-action:none}
button[aria-pressed="true"]{background:#78b4ff33;border-color:#78b4ff}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:0}
h2{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:1px 0 2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{font:700 17px ui-monospace,Menlo,monospace;color:var(--acc)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.wide{grid-column:1/-1}
.bars{display:grid;grid-template-columns:auto 1fr 52px;gap:1px 6px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#ffffff10;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--acc)}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#data{grid-column:1/-1}body{height:auto;overflow:auto}#cam,#maps{height:70vh}}
@media (max-width:700px){main{grid-template-columns:1fr}#data{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <b>QNXplorer</b>
  <span id="p-phone" class="pill">phone</span>
  <span id="p-guard" class="pill">guard</span>
  <span id="p-motor" class="pill">motors</span>
  <span id="p-goto" class="pill">goto</span>
  <span id="banner"></span>
</header>
<main>
  <div class="view" id="cam"><canvas id="camc"></canvas>
    <span class="tag" id="camtag">phone camera</span>
    <div class="tools"><button id="rot">rotate</button><button id="boxes">boxes on</button></div></div>
  <div id="maps">
    <div class="view" id="v3d"><canvas id="scene" title="Drag to orbit · pinch / wheel to zoom"></canvas><span class="tag" id="tag3d">3D LiDAR map</span>
      <div class="tools"><button id="points" aria-pressed="true">points</button><button id="surface" aria-pressed="false">surfaces</button><button id="reset">recenter</button></div></div>
    <div class="view" id="map"><canvas id="floor" title="Drag to pan · pinch / wheel to zoom"></canvas><span class="tag" id="maptag">floor map</span>
      <div class="tools"><button id="floor-reset">recenter</button><button id="minus">−</button><button id="plus">+</button></div></div>
  </div>
  <div id="data">
      <section><h2>Guard</h2><div class="kv" id="safety"></div></section>
      <section><h2>Motors</h2><div class="kv" id="motor"></div></section>
      <section><h2>Keyboard · Shift+WASD</h2><div class="keys" id="keys">—</div><div class="kv" id="keyboard"></div></section>
      <section><h2>Go-to · detector</h2><div class="kv" id="goto"></div></section>
      <section class="wide"><h2>Voice</h2><div class="kv" id="voice"></div></section>
      <section><h2>Phone sensors</h2><div class="kv" id="sensors"></div></section>
      <section><h2>Mapping</h2><div class="kv" id="mapping"></div></section>
      <section class="wide"><h2>Motion</h2><div class="bars" id="motion"></div></section>
  </div>
</main>
<script src="/room_controls.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d = 1, u = '') => typeof v === 'number' && isFinite(v) ? v.toFixed(d) + u : (typeof v === 'string' && v !== '' && !isNaN(+v) ? (+v).toFixed(d) + u : '—');
const t = (v, f = '—') => v === undefined || v === null || v === '' || v === '-' ? f : esc(v);
const c = (cls, v) => `<span class="${cls}">${v}</span>`;
const yes = (v, a = 'yes', b = 'no') => v === true ? c('ok', a) : v === false ? c('bad', b) : '—';
function kv(id, list) { $(id).innerHTML = list.filter(Boolean).map(([k, v]) => `<span>${esc(k)}</span><span title="${esc(String(v ?? '').replace(/<[^>]+>/g, ''))}">${v ?? '—'}</span>`).join(''); }
function pill(id, text, cls) { $(id).textContent = text; $(id).className = 'pill ' + cls; }
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) {} return v; };

let S = {}, room = null, rot = +(store('tars.rot') ?? 270), showBoxes = store('tars.boxes') !== '0';
$('rot').onclick = () => { rot = (rot + 90) % 360; store('tars.rot', rot); };
$('boxes').onclick = () => { showBoxes = !showBoxes; store('tars.boxes', showBoxes ? '1' : '0'); };

function render(s) {
  S = s;
  const sf = s.safety || {}, m = s.motor || {}, kb = s.keyboard || {}, v = s.voice || {}, g = s.goto || {}, gs = g.status || {}, nav = g.nav || {};
  const verdict = sf.verdict || 'STALE', vcls = verdict === 'CLEAR' ? 'ok' : verdict === 'CAUTION' ? 'warn' : 'bad';
  pill('p-phone', s.phone_connected ? (s.motion_live ? 'phone live' : 'phone idle') : 'phone off', s.phone_connected && s.motion_live ? 'ok' : 'bad');
  pill('p-guard', 'guard ' + verdict, vcls);
  pill('p-motor', m.inhibited ? 'motors stop: ' + (m.reason || '?') : 'motors open', m.inhibited ? 'warn' : 'ok');
  pill('p-goto', 'goto ' + (gs.state || (g.live ? '?' : 'off')) + (gs.target && gs.target !== '-' ? ' → ' + gs.target : ''), gs.state && gs.state !== 'idle' ? 'warn' : g.live ? 'ok' : 'bad');
  const issues = s.view_source ? ['via ' + s.view_source] : [];
  if (!s.publisher_live) issues.push('Pi status is stale');
  else if (!s.phone_connected) issues.push('Phone app not linked: open MotionUSB in the foreground and press Start');
  if (sf.reason === 'set_floor') issues.push('calibrate the floor in the phone app');
  $('banner').textContent = issues.join(' · ');

  kv('safety', [
    ['Verdict', c(vcls, t(verdict))], ['Permit', yes(sf.permit)], ['Reason', t(sf.reason)],
    ['LiDAR', t(sf.lidar_verdict)], ['Nearest', num(sf.nearest_obstacle_m ?? sf.nearest_m, 2, ' m')],
    ['Inferred', num(sf.inferred_nearest_m, 2, ' m')], ['Loop', num(sf.tick_hz, 0, ' Hz')], ['Age', num(sf.status_age_ms, 0, ' ms')],
  ]);
  const o = m.output || [], r = m.requested || [];
  kv('motor', [
    ['Driver', m.backend === 'gpio' ? 'Pi GPIO → L298N' : t(m.backend)], ['Linked', yes(m.connected)],
    ['State', m.inhibited ? c('warn', 'stopped') : c('ok', 'open')], ['Reason', t(m.reason)],
    ['Out L/R', num(o[0], 2) + ' / ' + num(o[1], 2)], ['Req L/R', num(r[0], 2) + ' / ' + num(r[1], 2)],
    ['Move', t(m.move) + (m.move_kind && m.move_kind !== '-' ? ' ' + esc(m.move_kind) + ' ' + num(m.move_req, 0) : '')],
    m.command_error ? ['Error', c('bad', t(m.command_error))] : null,
  ]);
  const keys = kb.keys || [];
  $('keys').textContent = keys.length ? keys.join('+') : kb.connected ? 'no keys' : 'no keyboard';
  kv('keyboard', [
    ['Receiver', yes(kb.connected, 'connected', 'not seen')], ['Driving', t(kb.active, 'no')],
    ['Override', kb.obstacle_override ? c('warn', 'Shift: guard bypassed') : 'off'], ['Owner', t(kb.owner)],
    ['Last', t((kb.last_keys || []).join('+'))], ['Events', t(kb.event_count, '0')],
    kb.error ? ['Note', c('warn', t(kb.error))] : null,
  ]);
  const dets = (g.dets && g.dets.dets) || [];
  kv('goto', [
    ['State', t(gs.state)], ['Target', t(gs.target)], ['Result', t(gs.result)],
    ['Seen', t(gs.seen, '0') + ' · fps ' + num(gs.fps, 1)], ['Path', t(gs.path)],
    ['Pose', t(nav.pose)], ['Map cells', t(nav.free, '0') + ' free · ' + t(nav.occ, '0') + ' occ'],
    ['LiDAR pkts', t(nav.packets, '0') + ' · age ' + num(nav.feed_age, 1, ' s')],
    ['Detections', dets.length ? dets.map(d => `${esc(d.label)} ${Math.round(d.conf * 100)}%`).join(', ') : c('mut', 'none')],
  ]);
  kv('voice', [
    ['Last', v.text ? '“' + t(v.text) + '”' + (v.at ? ' · ' + new Date(v.at * 1000).toLocaleTimeString() : '') : c('mut', 'nothing yet')],
    ['Pi heard', v.state === 'error' ? c('warn', t(v.reply)) : t(v.reply, v.text ? 'waiting…' : '—')],
  ]);
  kv('sensors', [
    ['Streams', s.streaming ? c('ok', 'on') : c('warn', 'paused')],
    ['Motion', (s.motion_live ? c('ok', 'live ') : c('bad', 'stale ')) + num(s.motion_hz, 0, ' Hz')],
    ['Camera', (s.camera_live ? c('ok', 'live ') : c('bad', 'stale ')) + num(s.camera_fps, 1, ' fps')],
    ['Frame age', num(s.camera_frame_age_ms, 0, ' ms')], ['Samples', t(s.samples, '0') + ' · gaps ' + t(s.gaps, '0')],
    ['Receipt', num(s.receipt_age_ms, 0, ' ms')], ['Edge AI', (s.ai || {}).live ? c('ok', 'live') : c('mut', 'off')],
  ]);
  const bar = (label, x, scale, unit) => {
    const ok = typeof x === 'number' && isFinite(x), f = ok ? Math.max(-1, Math.min(1, x / scale)) : 0;
    return `<span class="mut">${label}</span><div class="bar"><i style="left:${f < 0 ? 50 + f * 50 : 50}%;width:${Math.abs(f) * 50}%"></i></div><span>${num(x, 2)}</span>`;
  };
  const a = s.accel_m_s2 || [], gy = s.gyro_rad_s || [];
  $('motion').innerHTML = ['x', 'y', 'z'].map((k, i) => bar('acc ' + k + ' m/s²', a[i], 12)).join('') + ['x', 'y', 'z'].map((k, i) => bar('gyro ' + k + ' rad/s', gy[i], 3)).join('');
}

function fit(canvas) {
  const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * d) || canvas.height !== Math.round(r.height * d)) { canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d); }
  const g = canvas.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); return [g, r.width, r.height];
}

const img = new Image(); let imgOk = false;
img.onload = () => { imgOk = true; }; img.onerror = () => { imgOk = false; setTimeout(() => img.src = '/camera.mjpg?' + Date.now(), 1500); };
img.src = '/camera.mjpg';
function drawCam() {
  const [g, w, h] = fit($('camc')); g.clearRect(0, 0, w, h);
  const fresh = typeof S.camera_frame_age_ms === 'number' && S.camera_frame_age_ms < 2000;
  if (!imgOk || !img.naturalWidth || !fresh) {
    g.fillStyle = '#8ea2a8'; g.font = '14px system-ui'; g.textAlign = 'center';
    g.fillText('No phone camera frames: MotionUSB in the foreground, Start pressed', w / 2, h / 2);
    $('camtag').textContent = 'phone camera · waiting'; return;
  }
  const side = rot % 180 !== 0, iw = side ? img.naturalHeight : img.naturalWidth, ih = side ? img.naturalWidth : img.naturalHeight;
  const sc = Math.min(w / iw, h / ih), dw = iw * sc, dh = ih * sc, x0 = (w - dw) / 2, y0 = (h - dh) / 2;
  g.save(); g.translate(w / 2, h / 2); g.rotate(rot * Math.PI / 180);
  g.drawImage(img, -img.naturalWidth * sc / 2, -img.naturalHeight * sc / 2, img.naturalWidth * sc, img.naturalHeight * sc); g.restore();
  const d = (S.goto || {}).dets;
  if (showBoxes && d && d.w && d.h && (S.goto.dets_age_s ?? 99) < 2 && Math.abs(d.w / d.h - iw / ih) < 0.05) {
    g.lineWidth = 2; g.font = '600 12px system-ui'; g.textAlign = 'left';
    for (const b of d.dets || []) {
      const [x1, y1, x2, y2] = b.box, X = x0 + x1 / d.w * dw, Y = y0 + y1 / d.h * dh;
      g.strokeStyle = '#78b4ff'; g.strokeRect(X, Y, (x2 - x1) / d.w * dw, (y2 - y1) / d.h * dh);
      const label = `${b.label} ${Math.round(b.conf * 100)}%`; g.fillStyle = '#78b4ff'; g.fillRect(X, Y - 15, g.measureText(label).width + 8, 15);
      g.fillStyle = '#081018'; g.fillText(label, X + 4, Y - 4);
    }
  }
  $('camtag').textContent = `phone camera · ${num(S.camera_fps, 1, ' fps')} · ${S.camera_frame_age_ms} ms · rot ${rot}°`;
}

// 3D + floor map: the room view's renderers (pan / orbit / zoom via room_controls.js bindMap).
let patches = [], mode = 'points', yaw = .58, pitch = .48, zoom = 9, span = 8, framed;
const scenePan = {x: 0, y: 0}, floorPan = {x: 0, y: 0}, sceneC = $('scene'), floorC = $('floor');
function unpack(str) {
  if (!str) return [];
  const bytes = Uint8Array.from(atob(str), ch => ch.charCodeAt(0)), view = new DataView(bytes.buffer), out = [];
  for (let i = 0; i + 13 <= bytes.length; i += 13)
    out.push({p: [0, 2, 4].map(k => view.getInt16(i + k, true) / 100), n: [6, 7, 8].map(k => view.getInt8(i + k) / 127), rgb: Array.from(bytes.slice(i + 9, i + 12)), r: bytes[i + 12] / 100});
  return out;
}
function label(g, x, y, text) { g.font = '12px system-ui'; g.textAlign = 'left'; g.lineWidth = 3; g.strokeStyle = '#0d1417'; g.strokeText(text, x, y); g.fillStyle = '#eefaf3'; g.fillText(text, x, y); }
function sceneCoords(v, p, cy, sy, cp, sp) {
  const x = v[0] - p[0], y = v[1] - (room.floor_y ?? p[1]) - .6, z = v[2] - p[2], depth = x * sy + z * cy;
  return [x * cy - z * sy, -y * cp + depth * sp, y * sp + depth * cp];
}
function draw3() {
  const [g, w, h] = fit(sceneC);
  if (!room || !room.pose) { g.fillStyle = '#8ea2a8'; g.font = '13px system-ui'; g.textAlign = 'center'; g.fillText('No 3D scan yet', w / 2, h / 2); return; }
  const p = room.pose, scale = Math.min(w, h) / zoom, cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const project = v => { const [x, y, d] = sceneCoords(v, p, cy, sy, cp, sp); return [w / 2 + (scenePan.x + x) * scale, h / 2 + (scenePan.y + y) * scale, d]; };
  const live = room.publisher_live && room.tracking_live;
  const dots = (list, kind, r) => {
    const memory = kind === 'memory', opacity = memory ? (live ? .8 : .4) : kind === 'inferred' ? (live ? .45 : .2) : (live ? 1 : .45);
    (list || []).forEach((v, i) => {
      const weight = room.distant_confidence?.[i];
      g.globalAlpha = opacity * (memory ? Math.max(.08, Math.min(1, weight ?? .25)) : 1);
      const f = Math.min(1, Math.hypot(v[0] - p[0], v[1] - p[1], v[2] - p[2]) / 20), hue = memory ? .72 + .08 * f : .78 * f;
      g.fillStyle = `hsl(${360 * hue} 100% ${memory ? 72.5 : 55}%)`;
      const [x, y] = project(v); g.fillRect(x - r, y - r, 2 * r, 2 * r);
    });
    g.globalAlpha = 1;
  };
  if (mode === 'surface' && patches.length) {
    for (const [b, [x, y]] of patches.map(b => [b, project(b.p)]).sort((a, b) => a[1][2] - b[1][2])) {
      const [nx, ny, nz] = b.n, t2 = nx * sy + nz * cy, dx = nx * cy - nz * sy, dy = -ny * cp + t2 * sp, ratio = Math.abs(ny * sp + t2 * cp), rad = Math.max(1, b.r * scale);
      g.save(); g.translate(x, y); g.rotate(Math.atan2(dy, dx) + Math.PI / 2); g.scale(rad, rad * Math.max(.12, ratio));
      const grad = g.createRadialGradient(0, 0, 0, 0, 0, 1); grad.addColorStop(0, `rgb(${b.rgb})`); grad.addColorStop(.7, `rgba(${b.rgb},.78)`); grad.addColorStop(1, `rgba(${b.rgb},0)`);
      g.fillStyle = grad; g.fillRect(-1, -1, 2, 2); g.restore();
    }
  } else dots(room.points3d, 'measured', 2);
  dots(room.estimated3d, 'inferred', 1.5); dots(room.distant3d, 'memory', 1);
  for (const o of room.objects || []) { const [x, y] = project(o.position); label(g, x, y, o.label); }
  const [rx, ry] = project(p); label(g, rx, ry, '◆ Robot');
  $('tag3d').textContent = `3D LiDAR · ${(room.voxels || 0).toLocaleString()} voxels · ${patches.length.toLocaleString()} surfaces · drag to orbit`;
}
function drawFloor() {
  const [g, w, h] = fit(floorC);
  if (!room || !room.grid || !room.origin || !room.size) {
    g.fillStyle = '#8ea2a8'; g.font = '13px system-ui'; g.textAlign = 'center'; g.fillText('No floor map yet', w / 2, h / 2);
    kv('mapping', [['Map', 'waiting for the phone']]); return;
  }
  const p = room.pose || [0, 0, 0, 0], sc = Math.min(w, h) / span, X = x => w / 2 + (floorPan.x + x - p[0]) * sc, Y = z => h / 2 + (floorPan.y + z - p[2]) * sc;
  const colors = ['', '#2f6159', '#e6a760', '#9d78c1'], n = room.size, res = room.resolution, org = room.origin;
  for (let i = 0; i < room.grid.length; i++) { const k = colors[+room.grid[i]]; if (k) { g.fillStyle = k; g.fillRect(X(org[0] + (i % n) * res), Y(org[1] + Math.floor(i / n) * res), res * sc + .4, res * sc + .4); } }
  if (room.path?.length) { g.beginPath(); g.moveTo(X(p[0]), Y(p[2])); for (const pt of room.path) g.lineTo(X(pt[0]), Y(pt[pt.length - 1])); g.strokeStyle = '#78b4ff'; g.lineWidth = 2; g.stroke(); }
  for (const o of room.objects || []) label(g, X(o.position[0]), Y(o.position[2]), o.label);
  if (room.pose) { g.save(); g.translate(X(p[0]), Y(p[2])); g.rotate(-p[3]); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, 9); g.lineTo(-6, -5); g.lineTo(6, -5); g.closePath(); g.fill(); g.restore(); }
  label(g, 8, h - 8, span.toFixed(1) + ' m');
  $('maptag').textContent = 'floor · teal free · orange blocked · purple inferred' + (room.grid_source === 'native-nav' ? (room.native_map_live ? ' · A* map' : ' · A* stale') : '');
  kv('mapping', [
    ['Tracking', t(room.tracking, room.tracking_live ? 'live' : 'waiting')], ['Floor', room.floor_ready ? c('ok', 'calibrated') : c('warn', 'needed')],
    ['Frames', t(room.frames, '0')], ['3D cells', t(room.voxels, '0')], ['Targets', t((room.objects || []).length, '0')],
    ['Scan', num(room.scan_degrees, 0, '°')], ['Source', t(room.grid_source)],
  ]);
}
function fitMap(canvas, coords, pan, min, max) {
  let l = Infinity, r = -Infinity, tp = Infinity, b = -Infinity;
  for (const [x, y] of coords) { l = Math.min(l, x); r = Math.max(r, x); tp = Math.min(tp, y); b = Math.max(b, y); }
  const w = canvas.clientWidth, h = canvas.clientHeight;
  pan.x = -(l + r) / 2; pan.y = -(tp + b) / 2;
  return Math.min(max, Math.max(min, Math.max((r - l) / w, (b - tp) / h) * Math.min(w, h) * 1.23));
}
function fitScene() {
  yaw = .58; pitch = .48; zoom = 9; scenePan.x = scenePan.y = 0;
  if (!room?.pose) return;
  const pts = [room.pose, ...(room.points3d || []), ...(room.objects || []).map(o => o.position)];
  if (pts.length > 1) { const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch); zoom = fitMap(sceneC, pts.map(v => sceneCoords(v, room.pose, cy, sy, cp, sp)), scenePan, 1.5, 35); }
}
function fitFloor() {
  span = 8; floorPan.x = floorPan.y = 0;
  if (!room?.pose || !room.grid || !room.origin) return;
  const [x, , z] = room.pose, step = room.resolution, coords = [[0, 0]];
  for (let i = 0; i < room.grid.length; i++) { if (room.grid[i] === '0') continue; const dx = room.origin[0] + (i % room.size) * step - x, dz = room.origin[1] + Math.floor(i / room.size) * step - z; coords.push([dx, dz], [dx + step, dz + step]); }
  if (coords.length > 1) span = fitMap(floorC, coords, floorPan, 2, 30);
}
function drawMap() { draw3(); drawFloor(); }
bindMap(sceneC, scenePan, () => zoom, v => zoom = v, 1.5, 35, draw3, (dx, dy) => { yaw -= dx * .01; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * .01)); });
const floorZoom = bindMap(floorC, floorPan, () => span, v => span = v, 2, 30, drawFloor);
for (const id of ['points', 'surface']) $(id).onclick = () => { mode = id; for (const k of ['points', 'surface']) $(k).setAttribute('aria-pressed', String(k === mode)); draw3(); };
$('reset').onclick = () => { fitScene(); draw3(); };
$('floor-reset').onclick = () => { fitFloor(); drawFloor(); };
$('plus').onclick = () => floorZoom(1.4); $('minus').onclick = () => floorZoom(1 / 1.4);

async function poll() {
  try { const r = await fetch('/status.json', {cache: 'no-store'}); if (r.ok) render(await r.json()); }
  catch (e) { pill('p-phone', 'Pi unreachable', 'bad'); }
}
async function pollMap() {
  try {
    const r = await fetch('/map.json', {cache: 'no-store'});
    if (r.ok) {
      room = await r.json(); patches = unpack(room.surface_splats);
      if (room.pose && room.points3d?.length && framed !== (room.session ?? 'current')) { fitScene(); fitFloor(); framed = room.session ?? 'current'; }
    }
  } catch (e) {}
  drawMap();
}
(function frame() { drawCam(); requestAnimationFrame(frame); })();
poll(); pollMap(); setInterval(poll, 250); setInterval(pollMap, 500); addEventListener('resize', drawMap);
</script>
