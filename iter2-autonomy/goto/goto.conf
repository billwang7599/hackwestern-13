# goto thresholds. Every key is optional; these are the built-in defaults
# (iter2-autonomy/goto/tests checks this file matches them). Run: goto -c goto.conf
# Tune on the real robot; the stepper wheels only do ~41 mm/s.

# camera
hfov_deg = 60              # Logitech C270 horizontal field of view
min_conf = 0.30            # ignore weaker detections

# search: TURN in steps, look at fresh frames after each
search_step_deg = 30
search_max_deg = 360       # give up (BEEP 3) after a full circle with no sighting
search_speed = 0.40        # TURN speed fraction (all goto TURNs). <= 0.40 so a pivot can keep
                           # running if lidar_guard turns BLOCKED mid-turn (tars_motor caps
                           # pivots under BLOCKED at 0.40 and aborts faster ones)
settle_s = 0.35            # after a TURN ends, ignore frames this long (blur + camera latency)
look_frames = 4            # fresh frames to look at after each step
confirm_frames = 2         # ... of which this many must show the target
frame_timeout_s = 3.0      # no frames at all -> fail "no camera frames"

# align: big bearing -> one exact TURN toward it (the steppers are exact)
align_deg = 12
align_gain = 0.9           # TURN this fraction of the measured bearing
realign_deg = 20           # while driving, bearing above this -> S + exact TURN

# approach: D l r at tick_hz
fwd = 1.0                  # forward fraction when centred (1.0 = ~41 mm/s)
kp_per_deg = 0.035         # steering per degree of bearing
deadband_deg = 2.0
turn_max = 0.45
slow_deg = 25              # forward speed drops to 0 at this bearing
ema_alpha = 0.5            # box smoothing (1 = none)
tick_hz = 10               # D refresh (>= 5: tars_motor watchdog is 500 ms)

# arrive / lose
arrive_h_frac = 0.70       # box height >= 70% of the frame -> arrived. With the webcam
                           # ~12 cm up, level: stops ~0.5-0.7 m from a 0.4-0.8 m tall object.
                           # Mount it higher or tilt it and this changes: check STATUS h= on the robot.
arrive_bottom_frac = 0.97  # or the box bottom touches the frame bottom ...
arrive_bottom_min_h = 0.15 # ... and the box is at least 15% tall
arrive_frames = 2          # consecutive frames
lost_s = 1.2               # no target this long while driving -> S, search again
timeout_s = 240            # whole GOTO
move_timeout_pad_s = 3.0   # TURN overdue by 2*estimate + this -> fail

# object memory: every detection frame updates memory_path (see README "Object memory")
memory_path = memory.txt   # relative = next to this file; "-" = RAM only (forgotten on restart)
arrive_dist_mm = 550       # camera -> object distance at arrive_h; scales the rough box-height distance
memory_min_conf = 0.40     # weaker detections aren't remembered
memory_max_age_s = 1800    # GOTO trusts a remembered spot for 30 min
memory_drive_mm = 0        # remembered target not in view after turning to it: MOVE up to this far
                           # toward it and look again (0 = off: go straight to the normal search)
memory_save_s = 2          # write memory_path at most this often (atomic: .tmp + rename)
memory_merge_mm = 500      # a sighting this close to a remembered instance is that instance
                           # (else a new one: trash can #1, #2 ...)
memory_tries = 3           # GOTO tries at most this many remembered instances, then searches
cam_height_mm = 120        # webcam lens height above the floor: distance from where the box
cam_pitch_deg = 0          # bottom meets the floor (level camera; + = tilted down)

# map-guided GOTO: the phone's LDR1 feed on UDP/TCP 127.0.0.1:5572 builds goto's grid (nav.c);
# GOTO routes to a remembered object's map spot over A*, then YOLO confirms and docks.
# No feed / no pose = the visual-only GOTO above, unchanged.
nav_pose_fresh_s = 0.5     # no tracking-OK LDR1 pose this long -> ARKit lost, dead reckoning takes over
nav_turn_min_deg = 4       # path leg: exact TURN first only if the heading is off by more than this
nav_leg_min_mm = 60        # skip path legs shorter than this
nav_max_replans = 6        # guard-aborted legs / map changes per GOTO, then FAILED blocked
nav_guard_wait_s = 0.5     # after a blocked leg: wait this long (and for guard CLEAR), then re-plan
nav_reveal_deg = 30        # robot's own footprint not mapped: turn this much, re-plan (up to 360)
# lidar_guard's stop zone as goto predicts it from the map (a mirror of lidar_guard.cpp, not its
# thresholds): before a path leg's MOVE, if the map has an obstacle in that zone, tars_motor would
# refuse the MOVE, so pivot to the nearest heading whose zone is clear, drive nav_escape_mm, re-plan
nav_guard_stop_m = 0.6     # lidar_guard: BLOCKED at forward <= 0.6 m ...
nav_guard_half_w = 0.45    # ... |side| < 0.45 m ...
nav_guard_hfov_deg = 60    # ... inside the phone LiDAR's cone (>= 180 = the whole rectangle)
nav_escape_mm = 300        # 0 = off (old behaviour: turn to the waypoint, MOVE, refused, re-plan)
nav_move_max_mm = 1000     # tars_motor's MOVE limit (iter1-wasd/pi/src/wheels.h): longer legs in pieces

# per-object arrive height (label as in objects.txt)
arrive_h.person = 0.80     # top of a standing person is clipped: ~0.45 m from the legs
