# TARS gesture driving: shared tuning. Read by BOTH implementations:
#   vision/common/gesture.py   (Mac desktop prototype + QNX Python app)
#   vision/common/gesture.hpp  (QNX C++ app)
# Format: key = value, '#' comments. Unknown keys are an error (typo guard).
# Rules these numbers feed are described in vision/GESTURES.md.

# ---- hand shape (ratios are scale-free: distances / palm size) ----
# finger "extended" when |wrist->tip| > ext_ratio * |wrist->pip|
ext_ratio = 1.20
# finger "folded" when |wrist->tip| < fold_ratio * |wrist->pip|
fold_ratio = 1.00
# thumb "out" when |thumb_tip - index_mcp| > thumb_out * palm
thumb_out = 0.55
# a point/thumb direction must be within this many degrees of up/down/left/right
dir_tolerance_deg = 40

# ---- debounce / timing (milliseconds unless noted) ----
# consecutive identical frames needed before a MOVE fires
stable_frames = 4
# frames of open palm needed before STOP (1 = react on the first frame)
stop_frames = 1
# hand missing this long -> STOP (and cancel any move)
lost_ms = 250
# no camera frame this long -> STOP (camera stalled / app hung)
frame_timeout_ms = 400
# pause after a move finishes before the next one may start
cooldown_ms = 400
# 1 = holding a gesture repeats the move (after cooldown); 0 = must release first
hold_repeat = 1
# resend D this often during a move (server watchdog is 500 ms)
resend_ms = 100

# ---- moves ----
# forward/back step: speed in [0,1] and duration
step_speed = 0.50
step_ms = 600
# turn: wheels at +-turn_speed for turn_ms -> should be 30 degrees. CALIBRATE:
# run "python vision/desktop/calibrate_turn.py" (12 turns should = 360 deg)
turn_speed = 0.50
turn_ms = 450
# which way "point left" turns the rover: 1 = rover turns to ITS left (CCW seen
# from above). Set 0 if the rover faces you and you want it to turn toward
# where you point.
point_left_is_left = 1

# ---- mode switch: peace sign (index + middle up) toggles GESTURE <-> FOLLOW ----
# consecutive peace frames needed to toggle (also needs a release in between)
mode_frames = 6
# no second toggle within this long
mode_cooldown_ms = 1500

# ---- follow mode: steer toward the hand ----
# x error = hand centre - frame centre, in [-0.5, 0.5] of frame width (rover's view)
follow_deadband = 0.08
# turn = kp * (|err| - deadband), clamped to +-max_turn (wheel speed units)
follow_kp_turn = 1.2
follow_max_turn = 0.35
# hand size = wrist->middle-knuckle length / frame height. Bigger = closer.
follow_target_size = 0.22
follow_size_deadband = 0.03
# forward = kp * (target - size - deadband), clamped to [-max_back, max_fwd]
follow_kp_fwd = 3.0
follow_max_fwd = 0.45
# back up slowly when the hand is too close (0 = never reverse)
follow_max_back = 0.20
# max wheel speed change per second (smooths the 15 Hz stream)
follow_slew_per_s = 2.0
# send D this often while following (watchdog is 500 ms)
follow_send_ms = 66
# hand missing for this many consecutive frames -> STOP
follow_grace_frames = 4
# open palm held this many frames -> STOP (stop still wins in follow mode)
follow_palm_frames = 2
# 1 = flip the steering direction (if it turns AWAY from your hand)
follow_invert_turn = 0

# ---- camera / inference ----
# mirror the image before inference (selfie view: your left is image left)
flip = 1
# frames are downscaled to this width before MediaPipe (0 = no resize)
infer_width = 320
# MediaPipe hand landmarker thresholds
min_detection_confidence = 0.5
min_tracking_confidence = 0.5
